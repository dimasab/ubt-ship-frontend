* version 6 : -> time_of_latest_position showing correct time
*
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UBTShip Fleet Monitor</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;overflow:hidden;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:#111;color:#e8e8e8}

    /* ── loading ──────────────────────────────────────── */
    #loading{position:fixed;inset:0;background:#111;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;gap:16px}
    .spinner{width:48px;height:48px;border:4px solid #444;border-top-color:#22c55e;border-radius:50%;animation:spin .9s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .loading-txt{color:#aaa;font-size:.9rem}

    /* ── fleet screen ─────────────────────────────────── */
    #fleet-screen{height:100vh;overflow-y:auto;padding:24px;display:none}
    .fleet-hdr{text-align:center;padding:20px 0 30px}
    .fleet-hdr h1{font-size:2rem;color:#22c55e;letter-spacing:3px}
    .fleet-hdr .sub{margin-top:8px;color:#aaa;font-size:.88rem}
    .ships-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;max-width:1200px;margin:0 auto}

    .ship-card{background:#1e1e1e;border:1px solid #555;border-radius:3px;padding:20px;cursor:pointer;transition:transform .08s,border-color .08s;position:relative;overflow:hidden}
    .ship-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:#555;transition:background .08s}
    .ship-card:hover{transform:translateY(-2px);border-color:#22c55e}
    .ship-card:hover::before{background:#22c55e}
    .ship-card:active{transform:translateY(0)}

    .card-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
    .sig-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
    .sig-ok{background:#22c55e}
    .sig-lost{background:#ef4444}
    .card-name{font-size:1.1rem;font-weight:700;color:#f5f5f5;letter-spacing:.5px}

    .card-badge{display:inline-block;font-size:.72rem;padding:3px 10px;border-radius:3px;margin-bottom:14px;font-weight:600;letter-spacing:.3px}
    .st-moored{background:rgba(34,197,94,.15);color:#4ade80;border:1px solid rgba(34,197,94,.5)}
    .st-underway{background:rgba(34,197,94,.15);color:#86efac;border:1px solid rgba(34,197,94,.5)}
    .st-anchor{background:rgba(234,179,8,.15);color:#fde68a;border:1px solid rgba(234,179,8,.5)}
    .st-other{background:rgba(168,85,247,.15);color:#d8b4fe;border:1px solid rgba(168,85,247,.5)}

    .card-details{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:.8rem}
    .card-details .lbl{color:#999}
    .card-details .val{color:#ddd}

    /* ── detail screen ────────────────────────────────── */
    #detail-screen{display:none;height:100vh;flex-direction:column}
    .det-hdr{background:#111;border-bottom:1px solid #555;padding:12px 20px;display:flex;align-items:center;gap:16px;flex-shrink:0;min-height:54px}
    .btn-back{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.5);color:#4ade80;padding:7px 16px;border-radius:3px;cursor:pointer;font-size:.88rem;transition:background .08s}
    .btn-back:hover{background:rgba(34,197,94,.22)}
    .det-title{font-size:1.2rem;font-weight:700;color:#f5f5f5}
    .det-imo{margin-left:auto;font-size:.8rem;color:#999}

    .det-body{display:flex;flex:1;overflow:hidden;min-height:0}

    /* map col */
    .map-col{flex:1;display:flex;flex-direction:column;min-width:0}
    #map{flex:1;min-height:0;background:#111}
    .slider-wrap{background:#0d0d0d;border-top:1px solid #555;padding:14px 20px;flex-shrink:0}
    .slider-ends{display:flex;justify-content:space-between;font-size:.72rem;color:#aaa;margin-bottom:8px}
    .slider-track-wrap{position:relative}
    input[type=range]#time-slider{width:100%;-webkit-appearance:none;appearance:none;height:6px;border-radius:3px;background:#444;outline:none;cursor:pointer;position:relative;z-index:1}
    input[type=range]#time-slider::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;opacity:0;cursor:pointer}
    input[type=range]#time-slider::-moz-range-thumb{width:28px;height:28px;opacity:0;cursor:pointer;border:none}
    .slider-ship{position:absolute;top:50%;transform:scale(-1.1, 1.1) translateY(-14px);font-size:1.5rem;line-height:1;pointer-events:none;z-index:2}
    .slider-cur{text-align:center;margin-top:6px;font-size:.82rem;color:#4ade80;min-height:1.2em}

    /* info panel */
    .info-col{width:340px;flex-shrink:0;background:#161616;border-left:1px solid #555;display:flex;flex-direction:column;overflow:hidden}
    .sig-bar{padding:10px 16px;text-align:center;font-size:.82rem;font-weight:600;flex-shrink:0}
    .sig-bar.ok{background:rgba(34,197,94,.15);color:#86efac;border-bottom:1px solid rgba(34,197,94,.4)}
    .sig-bar.lost{background:rgba(239,68,68,.15);color:#fca5a5;border-bottom:1px solid rgba(239,68,68,.4);animation:blink .6s step-end infinite}
    @keyframes blink{0%,50%{opacity:1}51%,100%{opacity:.4}}
    .info-scroll{overflow-y:auto;flex:1}
    .info-sec{padding:14px 16px;border-bottom:1px solid #333}
    .info-sec-ttl{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:#aaa;margin-bottom:10px}
    .info-row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:3px 0;font-size:.82rem}
    .info-lbl{color:#999;flex-shrink:0}
    .info-val{color:#ddd;text-align:right;word-break:break-word}
    .info-val-2l{min-height:2.6em}
    .info-ports-meta{color:#777;font-size:.72rem;margin-bottom:8px}
    .info-ports-count{color:#777;font-size:.72rem}

    /* misc */
    .err-box{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.5);border-radius:3px;padding:16px 20px;color:#fca5a5;text-align:center;margin:20px auto;max-width:420px}
  </style>
</head>
<body>

<!-- Loading overlay -->
<div id="loading">
  <div class="spinner"></div>
  <div class="loading-txt">Loading fleet data…</div>
</div>

<!-- Fleet selection screen -->
<div id="fleet-screen">
  <div class="fleet-hdr">
    <h1>&#9875; UBTShip Fleet Monitor</h1>
    <div class="sub" id="fleet-sub"></div>
  </div>
  <div class="ships-grid" id="ships-grid"></div>
</div>

<!-- Ship detail screen -->
<div id="detail-screen">
  <div class="det-hdr">
    <button class="btn-back" id="btn-back">&#8592; Fleet</button>
    <div class="det-title" id="det-title"></div>
    <div class="det-imo" id="det-imo"></div>
  </div>
  <div class="det-body">
    <div class="map-col">
      <div id="map"></div>
      <div class="slider-wrap">
        <div class="slider-ends">
          <span id="lbl-old"></span>
          <span id="lbl-new"></span>
        </div>
        <div class="slider-track-wrap">
          <input type="range" id="time-slider" min="0" max="99" value="99"/>
          <span class="slider-ship" id="slider-ship">🚢</span>
        </div>
        <div class="slider-cur" id="slider-cur"></div>
      </div>
    </div>
    <div class="info-col">
      <div class="sig-bar" id="sig-bar"></div>
      <div class="info-scroll" id="info-scroll"></div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script>
(function () {
  'use strict';

  var snapshots      = [];   // API items, index 0 = newest
  var activeSnaps    = [];   // per-ship subset, same order (0 = newest)
  var activePortStats = [];  // per-ship dock stats, computed once per openDetail()
  var leafMap        = null;
  var shipMarker     = null;

  // ── helpers ──────────────────────────────────────────────────────────

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function fmtDate(iso) {
    if (!iso) return '—';
    try { return new Date(iso).toUTCString(); } catch(e) { return String(iso); }
  }

  function fmtShort(iso) {
    if (!iso) return '';
    try { return new Date(iso).toISOString().replace('T', ' ').slice(0, 16) + ' UTC'; } catch(e) { return String(iso); }
  }

  function fmtDuration(ms) {
    if (ms == null || isNaN(ms) || ms < 0) return '—';
    var totalMin = Math.round(ms / 60000);
    var days  = Math.floor(totalMin / 1440);
    var hours = Math.floor((totalMin % 1440) / 60);
    var mins  = totalMin % 60;
    var parts = [];
    if (days)  parts.push(days + 'd');
    if (hours) parts.push(hours + 'h');
    if (!days && mins) parts.push(mins + 'm');
    if (!parts.length) parts.push('<1m');
    return parts.join(' ');
  }

  // Derives per-port dock visits from a ship's snapshot history (oldest -> newest),
  // treating a contiguous run of snapshots sharing the same non-null current_port as one visit.
  // Visit duration is approximated as (last snapshot in run) - (first snapshot in run).
  function computeShipPortStats(shipSnaps) {
    var chron = shipSnaps.slice().reverse(); // oldest first
    var visits = [];
    var curPort = null, curStart = null, curEnd = null;

    chron.forEach(function(entry) {
      var port = entry.vessel.current_port || null;
      var t    = entry.generatedAt;
      if (port) {
        if (port === curPort) {
          curEnd = t;
        } else {
          if (curPort) visits.push({ port: curPort, start: curStart, end: curEnd });
          curPort = port; curStart = t; curEnd = t;
        }
      } else if (curPort) {
        visits.push({ port: curPort, start: curStart, end: curEnd });
        curPort = null; curStart = null; curEnd = null;
      }
    });
    if (curPort) visits.push({ port: curPort, start: curStart, end: curEnd }); // still docked as of latest snapshot

    var byPort = {};
    visits.forEach(function(v) {
      var dur = new Date(v.end) - new Date(v.start);
      if (!byPort[v.port]) byPort[v.port] = { port: v.port, visits: 0, totalMs: 0 };
      byPort[v.port].visits++;
      byPort[v.port].totalMs += dur;
    });

    return Object.keys(byPort).map(function(p) {
      var s = byPort[p];
      return { port: p, visits: s.visits, avgMs: s.totalMs / s.visits };
    }).sort(function(a, b) { return b.visits - a.visits; });
  }

  // Red icon if (snapshot generated_at) - (vessel time_of_latest_position) > 1 hour
  function isNoSignal(generatedAt, timeOfLatestPos) {
    if (!generatedAt || !timeOfLatestPos) return true;
    try { return (new Date(generatedAt) - new Date(timeOfLatestPos)) > 3600000; } catch(e) { return true; }
  }

  function statusClass(s) {
    if (!s) return 'st-other';
    var l = s.toLowerCase();
    if (l.indexOf('moor') !== -1)    return 'st-moored';
    if (l.indexOf('underway') !== -1) return 'st-underway';
    if (l.indexOf('anchor') !== -1)  return 'st-anchor';
    return 'st-other';
  }

  function shipIcon(headingDeg, noSig) {
    var color = noSig ? '#ef4444' : '#22c55e';
    var glow  = noSig ? '#ff8080' : '#4ade80';
    var h = Number(headingDeg) || 0;
    return L.divIcon({
      className : '',
      iconSize  : [32, 32],
      iconAnchor: [16, 16],
      html: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32"' +
            ' style="transform:rotate(' + h + 'deg)">'  +
            '<polygon points="16,3 23,29 16,25 9,29"' +
            ' fill="' + color + '" stroke="' + glow + '" stroke-width="1.5" stroke-linejoin="round"/>' +
            '</svg>',
    });
  }

  function posShip() {
    var sl = document.getElementById('time-slider');
    var sh = document.getElementById('slider-ship');
    if (!sh || !sl || !sl.offsetWidth) return;
    var pct = (sl.max > sl.min) ? (+sl.value - +sl.min) / (+sl.max - +sl.min) : 0;
    sh.style.left = Math.round(pct * (sl.offsetWidth - 28)) + 'px';
  }

  // ── fetch ─────────────────────────────────────────────────────────────

  function init() {
    fetch('/ubtship/read-json?limit=500&page=1')
      .then(function(r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function(data) {
        snapshots = data.items || [];
        if (!snapshots.length) throw new Error('No snapshots available');
        hide('loading');
        buildFleet();
      })
      .catch(function(e) {
        document.getElementById('loading').innerHTML =
          '<div class="err-box">Failed to load fleet data:<br>' + esc(e.message) + '</div>';
      });
  }

  // ── fleet screen ──────────────────────────────────────────────────────

  function buildFleet() {
    var latest  = snapshots[0];
    var vessels = (latest && latest.content && latest.content.vessels) || [];
    var genAt   = latest && latest.content && latest.content.generated_at;

    document.getElementById('fleet-sub').textContent =
      (genAt ? 'Last snapshot: ' + fmtDate(genAt) + '  ·  ' : '') + vessels.length + ' vessel(s)';

    var grid = document.getElementById('ships-grid');
    grid.innerHTML = '';

    if (!vessels.length) {
      grid.innerHTML = '<div class="err-box">No vessels in latest snapshot.</div>';
    }

    vessels.forEach(function(v) {
      var noSig = isNoSignal(genAt, v.time_of_latest_position);
      var card  = document.createElement('div');
      card.className = 'ship-card';
      card.innerHTML =
        '<div class="card-top">' +
          '<span class="sig-dot ' + (noSig ? 'sig-lost' : 'sig-ok') + '"></span>' +
          '<span class="card-name">' + esc(v.name) + '</span>' +
        '</div>' +
        '<div class="card-badge ' + statusClass(v.navigational_status) + '">' + esc(v.navigational_status || 'Unknown') + '</div>' +
        '<div class="card-details">' +
          '<span class="lbl">Flag</span><span class="val">' + esc(v.flag || '—') + '</span>' +
          '<span class="lbl">Speed</span><span class="val">' + (v.speed_kn != null ? v.speed_kn + ' kn' : '—') + '</span>' +
          '<span class="lbl">Heading</span><span class="val">' + (v.true_heading_deg != null ? v.true_heading_deg + '°' : '—') + '</span>' +
          '<span class="lbl">Destination</span><span class="val">' + esc(v.matched_destination || v.reported_destination || '—') + '</span>' +
        '</div>';
      card.addEventListener('click', function() { openDetail(v.name); });
      grid.appendChild(card);
    });

    show('fleet-screen', 'block');
  }

  // ── detail screen ─────────────────────────────────────────────────────

  function openDetail(shipName) {
    hide('fleet-screen');

    // collect this ship's entries across all snapshots, preserving newest-first order
    activeSnaps = snapshots
      .map(function(snap) {
        if (!snap.content) return null;
        var vessels = snap.content.vessels || [];
        var v = null;
        for (var i = 0; i < vessels.length; i++) {
          if (vessels[i].name === shipName) { v = vessels[i]; break; }
        }
        return v ? { vessel: v, generatedAt: snap.content.generated_at } : null;
      })
      .filter(Boolean);

    if (!activeSnaps.length) return;

    activePortStats = computeShipPortStats(activeSnaps);

    document.getElementById('det-title').textContent = shipName;
    document.getElementById('det-imo').textContent   = 'IMO ' + (activeSnaps[0].vessel.imo || '—');

    // Slider: value 0 (leftmost) = oldest  →  value N-1 (rightmost) = newest
    // activeSnaps[0] = newest, activeSnaps[N-1] = oldest
    // mapping: snapshotIndex = (N-1) - sliderValue
    var N      = activeSnaps.length;
    var slider = document.getElementById('time-slider');
    slider.min   = 0;
    slider.max   = N - 1;
    slider.value = N - 1; // start at rightmost = newest

    document.getElementById('lbl-old').textContent = fmtShort(activeSnaps[N - 1].generatedAt);
    document.getElementById('lbl-new').textContent = fmtShort(activeSnaps[0].generatedAt);

    slider.oninput = function() {
      renderSnap((N - 1) - parseInt(slider.value, 10));
      posShip();
    };

    // init Leaflet once
    show('detail-screen', 'flex');
    if (!leafMap) {
      leafMap = L.map('map', { zoomControl: true }).setView([0, 90], 3);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
      }).addTo(leafMap);
    }

    setTimeout(function() {
      leafMap.invalidateSize();
      renderSnap(0); // show newest
      posShip();
    }, 80);
  }

  function renderSnap(idx) {
    var entry = activeSnaps[idx];
    if (!entry) return;
    var v     = entry.vessel;
    var genAt = entry.generatedAt;
    var noSig = isNoSignal(genAt, v.time_of_latest_position);
    var hdg   = v.true_heading_deg != null ? v.true_heading_deg : (v.course_deg != null ? v.course_deg : 0);

    document.getElementById('slider-cur').textContent =
      genAt ? 'Snapshot: ' + fmtDate(genAt) : '';

    // update map marker
    if (v.latitude != null && v.longitude != null) {
      var icon = shipIcon(hdg, noSig);
      if (!shipMarker) {
        shipMarker = L.marker([v.latitude, v.longitude], { icon: icon }).addTo(leafMap);
        leafMap.setView([v.latitude, v.longitude], 6);
      } else {
        shipMarker.setLatLng([v.latitude, v.longitude]);
        shipMarker.setIcon(icon);
      }
    }

    // signal bar
    var bar = document.getElementById('sig-bar');
    if (noSig) {
      var ago = (genAt && v.time_of_latest_position) ? new Date(genAt) - new Date(v.time_of_latest_position) : null;
      bar.className   = 'sig-bar lost';
      bar.textContent = '\u26a0 NO SIGNAL : Last AIS position ' + (ago != null ? fmtDuration(ago) + ' ago' : 'unknown');
    } else {
      bar.className   = 'sig-bar ok';
      bar.textContent = '\u2714 Signal OK';
    }

    renderInfo(v);
  }

  function renderInfo(v) {
    var cv = v.current_voyage || {};

    var html =
      sec('Position', [
        ['Latitude',          v.latitude  != null ? v.latitude.toFixed(6)  : '—'],
        ['Longitude',         v.longitude != null ? v.longitude.toFixed(6) : '—'],
        ['Last AIS Time',     fmtDate(v.time_of_latest_position)],
        ['Position Received', v.position_received || '—', 'info-val-2l'],
      ]) +
      sec('Navigation', [
        ['Status',       v.navigational_status || '—'],
        ['Speed',        v.speed_kn != null ? v.speed_kn + ' kn' : '—'],
        ['Course',       v.course_deg != null ? v.course_deg + '\u00b0' : '—'],
        ['True Heading', v.true_heading_deg != null ? v.true_heading_deg + '\u00b0' : '—'],
        ['Rate of Turn', v.rate_of_turn_deg_per_min != null ? v.rate_of_turn_deg_per_min + ' \u00b0/min' : '—'],
        ['Draught',      v.draught_m != null ? v.draught_m + ' m' : '—'],
      ]) +
      sec('Vessel', [
        ['IMO',         v.imo       || '—'],
        ['MMSI',        v.mmsi      || '—'],
        ['Call Sign',   v.call_sign || '—'],
        ['Flag',        v.flag      || '—'],
        ['Type',        v.detailed_vessel_type || v.general_vessel_type || '—'],
        ['AIS Class',   v.ais_transponder_class || '—'],
        ['AIS Source',  v.ais_source || '—'],
      ]) +
      sec('Voyage', [
        ['From',          cv.from || '—'],
        ['To',            cv.to   || '—'],
        ['Departed',      fmtDate(cv.actual_departure_time)],
        ['Arrived',       fmtDate(cv.actual_arrival_time)],
        ['Destination',   v.matched_destination || v.reported_destination || '—'],
        ['Reported ETA',  fmtDate(v.reported_eta)],
        ['Current Port',  v.current_port  || '—'],
        ['Dest. Port',    v.destination_port || '—'],
        ['Vessel Local',  fmtDate(v.vessel_local_time)],
      ]) +
      secPorts();

    document.getElementById('info-scroll').innerHTML = html;
  }

  function secPorts() {
    var n     = activeSnaps.length;
    var since = n ? activeSnaps[n - 1].generatedAt : null;

    var h = '<div class="info-sec"><div class="info-sec-ttl">Ports</div>' +
            '<div class="info-ports-meta">Data from ' + n + ' snapshot' + (n === 1 ? '' : 's') +
            (since ? ' since ' + fmtShort(since) : '') + '</div>';

    if (!activePortStats.length) {
      h += '<div class="info-row"><span class="info-lbl">No port visits recorded</span></div>';
    } else {
      h += '<div class="info-row"><span class="info-lbl"></span><span class="info-val info-ports-count">avg / visit</span></div>';
      activePortStats.forEach(function(s) {
        h += '<div class="info-row">' +
             '<span class="info-lbl">' + esc(s.port) + ' <span class="info-ports-count">(' + s.visits + 'x)</span></span>' +
             '<span class="info-val">' + fmtDuration(s.avgMs) + '</span>' +
             '</div>';
      });
    }
    return h + '</div>';
  }

  function sec(title, rows) {
    var h = '<div class="info-sec"><div class="info-sec-ttl">' + esc(title) + '</div>';
    rows.forEach(function(r) {
      h += '<div class="info-row">' +
           '<span class="info-lbl">' + esc(r[0]) + '</span>' +
           '<span class="info-val' + (r[2] ? ' ' + r[2] : '') + '">'  + esc(r[1]) + '</span>' +
           '</div>';
    });
    return h + '</div>';
  }

  // ── navigation ────────────────────────────────────────────────────────

  document.getElementById('btn-back').addEventListener('click', function() {
    hide('detail-screen');
    show('fleet-screen', 'block');
    if (shipMarker) { leafMap.removeLayer(shipMarker); shipMarker = null; }
  });

  // ── util ──────────────────────────────────────────────────────────────

  function show(id, display) { document.getElementById(id).style.display = display || 'block'; }
  function hide(id)           { document.getElementById(id).style.display = 'none'; }

  init();
}());
</script>
</body>
</html>
